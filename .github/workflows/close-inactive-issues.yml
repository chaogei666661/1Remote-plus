name: Close inactive issues
on:
  schedule:
    - cron: "30 1 * * *"

jobs:
  close-issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      # v8 still asks for node16; v10 is the first major that runs on node24 natively. Every input below
      # is unchanged between the two.
      - uses: actions/stale@v10
        with:
          days-before-issue-stale: 30
          days-before-issue-close: 14
          stale-issue-label: "stale"
          stale-issue-message: "This issue is stale because it has been open for 30 days with no activity."
          close-issue-message: "This issue was closed because it has been inactive for 14 days since being marked as stale."
          exempt-issue-labels: 'task-put-off,task-still-considering,task-working-in-progress'
          exempt-all-issue-milestones: true
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-pr-stale: -1
          days-before-pr-close: -1
