# Every push to main/master bumps Ui/AppVersion.cs, builds it and publishes a full (never pre-release)
# GitHub release. Three things stop that from feeding itself:
#
#   1. the version commit is subject "chore(release): <tag> [skip ci]", which GitHub itself refuses to
#      build, and JobBuild's `if` rejects it a second time in case that ever stops being true
#   2. there is deliberately no `tags:` trigger any more, so the version tag this workflow pushes cannot
#      start a second build+release of the same commit
#   3. the Release job upserts, so re-running it over a tag that already shipped refreshes that release
#      instead of failing on "already_exists"
name: Build/Publish on push

on:
  push:
    branches:
      - "*master*"
      - "*main*"
  # PRs never hit the push-to-main path, so without this the test step would only run after merge.
  pull_request:
    branches:
      - main
      - master
  # lets a build be started from the Actions tab without pushing another commit
  workflow_dispatch:

# Two overlapping runs on the same branch would both bump from the same base and race on the push. The
# queued one still starts from its own commit, so the bump step also re-reads the build number from the
# remote before incrementing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  JobBuild:
    permissions:
      contents: write # pushes the version bump commit and its tag
    name: build_and_release
    runs-on: windows-latest
    if: |
      github.event_name == 'pull_request' ||
      (
        !contains(github.event.head_commit.message, 'WIP') &&
        !contains(github.event.head_commit.message, '[skip ci]') &&
        !contains(github.event.head_commit.message, '[ci skip]') &&
        !startsWith(github.event.head_commit.message, 'chore(release):')
      )

    env:
      configuration: Release
      Main_Project: Ui/Ui.csproj
      Action_Url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Echo
        shell: pwsh
        run: |
          echo "url = $env:Action_Url"
          echo "home = $HOME"
          echo "github.ref = ${{ github.ref }}"

      # Every action below is pinned to a major that declares `runs.using: node24`. GitHub forces anything
      # still asking for node20 onto node24 anyway and annotates the run for it, so the pin only makes
      # explicit what the runner already does.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive
          # left at the default on purpose: the bump commit below pushes with this token
          persist-credentials: true

      # Install the .NET Core workload https://github.com/actions/setup-dotnet
      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            6.0.x
            9.0.x

      # Add MSBuild to the PATH: https://github.com/microsoft/setup-msbuild
      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v3

      # cache nuget packages: https://github.com/actions/cache
      - name: Cache nuget packages
        id: cache-nuget-packages
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}\.nuget\packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Ui/Ui.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Cache nuget packages home # https://github.com/actions/cache
        id: cache-nuget-packages-home
        uses: actions/cache@v5
        with:
          path: C:\Users\runneradmin\.nuget\packages
          key: ${{ runner.os }}-nuget-home-${{ hashFiles('Ui/Ui.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-home

      # A release is only ever cut from a push (or a manual run) that sits on main/master. Pull requests
      # and every other branch get restore + test and write nothing back to the repository.
      - name: Decide whether this run releases
        id: gate
        shell: bash
        env:
          RELEASE: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
        run: |
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "this run publishes a release: $RELEASE"

      # Bump before the compile so the binaries actually carry the number that gets released. Nothing is
      # committed here — if the tests below fail, the working-tree bump is simply thrown away with the
      # runner.
      - name: Bump the build number
        id: bump
        if: steps.gate.outputs.release == 'true'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          # A run queued behind another one checks out its own, pre-bump commit, so the number in the
          # tree may already be taken. Start from whichever of the two is higher.
          $pattern = 'public const uint Build = (\d+);'
          $local = [int][regex]::Match((Get-Content Ui/AppVersion.cs -Raw), $pattern).Groups[1].Value
          $base = $local
          git fetch --quiet origin $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -eq 0) {
            $remoteFile = (git show "origin/$($env:GITHUB_REF_NAME):Ui/AppVersion.cs" | Out-String)
            $match = [regex]::Match($remoteFile, $pattern)
            if ($LASTEXITCODE -eq 0 -and $match.Success) {
              $base = [Math]::Max($local, [int]$match.Groups[1].Value)
            }
          }
          ./scripts/Bump-BuildVersion.ps1 -Build ($base + 1)

      # Restore nuget packages
      - name: Restore nuget packages 📦️
        run: msbuild $env:Main_Project /t:Restore /p:Configuration=$env:Configuration

      # Run script
      - name: Run script
        shell: pwsh
        run: |
          # A fork does not inherit the upstream repository's secrets, and Set-Secret.ps1 exits 1 on an empty
          # one. Skipping the substitution instead leaves the placeholder constant in Assert.cs, which
          # compiles and runs: telemetry is simply inert. Note that the encryption salt then falls back to a
          # publicly known constant, so a build produced this way must not be pointed at a password store
          # created by an official release.
          $replacements = @(
            @{ Pattern = "===REPLACE_ME_WITH_SENTRY_IO_DEN==="    ; Value = "${{ secrets.SENTRY_IO_DEN }}" },
            @{ Pattern = "===REPLACE_ME_WITH_SALT==="             ; Value = "${{ secrets.GLOBAL_STRING_ENCRYPTION_SLAT }}" }
          )
          foreach ($r in $replacements) {
            if ([string]::IsNullOrWhiteSpace($r.Value)) {
              # A notice, not a warning: on a fork these two secrets are expected to be missing, and the
              # placeholder build is the documented outcome rather than something that needs looking at.
              # The app itself still says so at runtime. See DEVELOP.md.
              Write-Host "::notice::No secret configured for $($r.Pattern), keeping the placeholder."
              continue
            }
            ./scripts/Set-Secret.ps1 -filePath .\Ui\Assert.cs -Pattern $r.Pattern -Secret $r.Value
          }

      # Get ${{env.BuildVersion}} and ${{env.PreRelease}} — after the bump, so they describe the build
      # that is about to be published. PreRelease is always empty on a released build.
      - name: Get Version
        id: get_version
        run: ./scripts/Get-Version.ps1

      # The restore above is msbuild on Ui only, so the test project has never been restored here and
      # needs its own pass before it can build.
      - name: Restore the test project 📦️
        run: dotnet restore Tests/Tests.csproj

      # Nothing used to run these: the suite existed and a regression in it shipped unnoticed. It goes
      # before the publish steps so a broken build never becomes a release artifact. The runner is
      # windows-latest with the same .NET 9 SDK the app needs, so the WPF-flavoured test project builds
      # and runs here exactly as it does on a developer machine.
      - name: Run tests 🧪
        run: dotnet test Tests/Tests.csproj -c Release

      # Publish the application net9.0
      # PRs only need restore + test; publishing twice on every review would dominate the wall clock
      # and still not be a release.
      - name: Publish the application net9
        if: github.event_name != 'pull_request'
        run: dotnet publish $env:Main_Project -p:PublishProfile=./Ui/Properties/PublishProfiles/x64-net90.pubxml
      # artifact
      # upload-artifact@v6 and download-artifact@v7 are the same generation of the artifact client (both
      # ship @actions/artifact v4 on node24). Upgrade the two together or the download job stops finding
      # what this job stored.
      - uses: actions/upload-artifact@v6
        if: github.event_name != 'pull_request'
        with:
          name: 1Remote-${{env.BuildVersion}}-net9-x64
          path: Ui/bin/Release/net9.0-windows/publish/win-x64

      # Publish the application net9.0
      - name: Publish x64-net90-self-contained
        if: github.event_name != 'pull_request'
        run: dotnet publish $env:Main_Project -p:PublishProfile=./Ui/Properties/PublishProfiles/x64-net90-self-contained.pubxml
      # artifact
      - uses: actions/upload-artifact@v6
        if: github.event_name != 'pull_request'
        with:
          name: 1Remote-${{env.BuildVersion}}-net9-x64-self-contained
          path: Ui/bin/Release/net9.0-windows-self-contained/publish/win-x64

      # Only now that the tests passed and both artifacts exist does the new version become a fact in
      # the repository. [skip ci] in the subject is what keeps this from starting another release.
      - name: Commit and tag the new version
        if: steps.gate.outputs.release == 'true'
        shell: bash
        env:
          NEW_BUILD: ${{ steps.bump.outputs.build }}
          BUILD_VERSION: ${{ env.BuildVersion }}
        run: |
          if [ -z "${BUILD_VERSION:-}" ]; then
            echo "::error::BuildVersion is empty, refusing to tag"
            exit 1
          fi
          BRANCH="$GITHUB_REF_NAME"
          TAG="v$BUILD_VERSION"

          tip_build() {
            sed -n 's/.*public const uint Build = \([0-9][0-9]*\);.*/\1/p' Ui/AppVersion.cs | head -n 1
          }

          # The build rewrites Ui/Ui.csproj (AssemblyVersion) and stamps a build date into
          # Ui/AppVersion.cs through the PreBuild/PostBuild targets, so restore the tree and re-apply the
          # bump with the number this run already settled on. The commit then holds exactly the two
          # constants the bump owns and nothing the compiler left behind.
          git checkout -- Ui/AppVersion.cs Ui/Ui.csproj Ui/Assert.cs
          pwsh -NoProfile -File ./scripts/Bump-BuildVersion.ps1 -Build "$NEW_BUILD"
          cp Ui/AppVersion.cs ../AppVersion.bumped.cs

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Anything that landed on the branch while this build ran is moved onto rather than rebased
          # over: a rebase would replay two edits of the same constant and stop on a conflict, while
          # re-applying the file always resolves the way it has to, in favour of the higher number this
          # run has already put in the binaries.
          pushed=""
          for attempt in 1 2 3; do
            cp ../AppVersion.bumped.cs Ui/AppVersion.cs
            git add Ui/AppVersion.cs
            git commit -m "chore(release): $TAG [skip ci]"
            if git push origin "HEAD:refs/heads/$BRANCH"; then
              pushed="yes"
              break
            fi
            echo "push rejected, moving the bump onto the new tip of $BRANCH (attempt $attempt)"
            git fetch origin "$BRANCH"
            git reset --hard FETCH_HEAD
            if [ "$(tip_build)" -ge "$NEW_BUILD" ]; then
              echo "::error::$BRANCH is already at build $(tip_build), but this run built $NEW_BUILD"
              break
            fi
          done
          if [ -z "$pushed" ]; then
            echo "::error::could not push the version bump for $TAG"
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::warning::$TAG already exists on origin, leaving it as it is"
          else
            git tag -a "$TAG" -m "$TAG"
            git push origin "refs/tags/$TAG"
          fi

    outputs:
      BuildVersion: ${{env.BuildVersion}}
      PreRelease: ${{env.PreRelease}}
      release: ${{ steps.gate.outputs.release }}
      tag: v${{env.BuildVersion}}
      artifact_net9x: 1Remote-${{env.BuildVersion}}-net9-x64
      artifact_net9xsc: 1Remote-${{env.BuildVersion}}-net9-x64-self-contained

  # Publishes the tag JobBuild just pushed. Always a full release: draft and prerelease are both off, so
  # /releases/latest resolves to it and AppVersion.UpdateCheckUrls finds it.
  Release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: JobBuild
    # granted per job, because a repository whose default workflow permission is read-only - which is the
    # default for a new one, and for a fork - otherwise fails with "Resource not accessible by
    # integration". A fork publishes to itself: gh acts on github.repository, and a fork's own
    # GITHUB_TOKEN can write its releases. Only NightlyRelease stays pinned to upstream, because it
    # uploads into a release id there.
    permissions:
      contents: write
    if: needs.JobBuild.outputs.release == 'true'
    env:
      TAG: ${{needs.JobBuild.outputs.tag}}
      NOTES: release-notes.md
    steps:
      - name: Echo
        run: |
          echo "version = ${{needs.JobBuild.outputs.BuildVersion}}"
          echo "tag = $TAG"

      # Checked out at the tag, not at the branch, so the release notes are cut against the same commit
      # the assets were built from even if main has moved on since.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{needs.JobBuild.outputs.tag}}
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      # download artifact net9.x & ZIP
      - uses: actions/download-artifact@v7
        with:
          name: ${{needs.JobBuild.outputs.artifact_net9x}}
          path: ${{needs.JobBuild.outputs.artifact_net9x}}
      - name: Easy Zip Files
        uses: vimtor/action-zip@v1.3
        with:
          files: ${{needs.JobBuild.outputs.artifact_net9x}}
          dest: ${{needs.JobBuild.outputs.artifact_net9x}}.zip
      - uses: actions/download-artifact@v7
        with:
          name: ${{needs.JobBuild.outputs.artifact_net9xsc}}
          path: ${{needs.JobBuild.outputs.artifact_net9xsc}}
      - name: Easy Zip Files
        uses: vimtor/action-zip@v1.3
        with:
          files: ${{needs.JobBuild.outputs.artifact_net9xsc}}
          dest: ${{needs.JobBuild.outputs.artifact_net9xsc}}.zip

      - name: Generate release notes from git log
        shell: bash
        run: |
          # The tag has to be passed in: the script falls back to GITHUB_REF_NAME, which is the branch
          # name on a push and would make it diff main against itself.
          bash .github/scripts/release-notes.sh "$TAG" > "$NOTES"
          cat "$NOTES"

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NET9: ${{needs.JobBuild.outputs.artifact_net9x}}.zip
          NET9SC: ${{needs.JobBuild.outputs.artifact_net9xsc}}.zip
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A re-run over a tag that already shipped refreshes it instead of failing, and demotes it
            # back to a full release if it was ever marked otherwise.
            echo "$TAG already exists, updating it"
            gh release upload "$TAG" "$NET9" "$NET9SC" --clobber
            gh release edit "$TAG" \
              --title "$TAG" \
              --notes-file "$NOTES" \
              --draft=false \
              --prerelease=false \
              --latest
          else
            # No --prerelease anywhere: gh defaults to a full release, which is the point of this job.
            gh release create "$TAG" "$NET9" "$NET9SC" \
              --title "$TAG" \
              --notes-file "$NOTES" \
              --verify-tag \
              --latest
          fi

  # publish nightly build
  NightlyRelease:
    name: Nightly publish
    runs-on: ubuntu-latest
    needs: JobBuild
    # The release this uploads to is hardcoded to the upstream repository, and a fork's GITHUB_TOKEN has no
    # access to it — the step fails with "Not Found". Forks still get the build and its artifacts.
    if: |
      github.repository == '1Remote/1Remote' &&
      !contains(github.event.head_commit.message, 'WIP')
    steps:
      - name: Echo
        run: |
          echo ${{needs.JobBuild.outputs.BuildVersion}}
          echo ${{needs.JobBuild.outputs.PreRelease}}

      # download artifact net9.x & ZIP
      - uses: actions/download-artifact@v7
        with:
          name: ${{needs.JobBuild.outputs.artifact_net9x}}
          path: ${{needs.JobBuild.outputs.artifact_net9x}}
      - uses: vimtor/action-zip@v1.3
        with:
          files: ${{needs.JobBuild.outputs.artifact_net9x}}
          dest: ${{needs.JobBuild.outputs.artifact_net9x}}.zip
      - uses: actions/download-artifact@v7
        with:
          name: ${{needs.JobBuild.outputs.artifact_net9xsc}}
          path: ${{needs.JobBuild.outputs.artifact_net9xsc}}
      - uses: vimtor/action-zip@v1.3
        with:
          files: ${{needs.JobBuild.outputs.artifact_net9xsc}}
          dest: ${{needs.JobBuild.outputs.artifact_net9xsc}}.zip

      # for 1Remote project
      # publish nightly with WebFreak001/deploy-nightly@v2.0.0
      # Left on v2.0.0: the action has no node24 release yet, and this job only ever runs on the upstream
      # repository, so it is not part of the annotations a fork's build produces.
      - uses: WebFreak001/deploy-nightly@v2.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # automatically provided by github actions
        with:
          upload_url: https://uploads.github.com/repos/1Remote/1Remote/releases/96075099/assets{?name,label} # find out this value by opening https://api.github.com/repos/<owner>/<repo>/releases in your browser and copy the full "upload_url" value including the {?name,label} part
          release_id: 96075099 # same as above (id can just be taken out the upload_url, it's used to find old releases)
          asset_path: ${{needs.JobBuild.outputs.artifact_net9x}}.zip # path to archive to upload
          asset_name: ${{needs.JobBuild.outputs.artifact_net9x}}-nightly-$$.zip # name to upload the release as, use $$ to insert date (YYYYMMDD) and 6 letter commit hash
          asset_content_type: application/zip # required by GitHub API
          max_releases: 20 # optional, if there are more releases than this matching the asset_name, the oldest ones are going to be deleted

      - uses: WebFreak001/deploy-nightly@v2.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # automatically provided by github actions
        with:
          upload_url: https://uploads.github.com/repos/1Remote/1Remote/releases/96075099/assets{?name,label} # find out this value by opening https://api.github.com/repos/<owner>/<repo>/releases in your browser and copy the full "upload_url" value including the {?name,label} part
          release_id: 96075099 # same as above (id can just be taken out the upload_url, it's used to find old releases)
          asset_path: ${{needs.JobBuild.outputs.artifact_net9xsc}}.zip # path to archive to upload
          asset_name: ${{needs.JobBuild.outputs.artifact_net9x}}-nightly-$$-self-contained.zip # name to upload the release as, use $$ to insert date (YYYYMMDD) and 6 letter commit hash
          asset_content_type: application/zip # required by GitHub API
          max_releases: 20 # optional, if there are more releases than this matching the asset_name, the oldest ones are going to be deleted
